[project]
name = "backend"
version = "0.1.0"
description = "Stateless weather-aware route assessment API"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
